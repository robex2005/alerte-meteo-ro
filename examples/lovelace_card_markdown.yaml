# Card Markdown universal: avertizări ANM active/viitoare + nowcasting.
#
# Nu trebuie editat pentru județul tău: județul ANM se citește din atributul
# `judet_cod` al lui sensor.mesaj_meteo_<județ>, iar senzorii nowcasting
# (sensor.alerta_nowcasting_<județ>) sunt găsiți automat - câte unul pe județ ales.

type: markdown
title: Meteo
content: |-
  {% set luni = {'ianuarie':1,'februarie':2,'martie':3,'aprilie':4,'mai':5,'iunie':6,'iulie':7,'august':8,'septembrie':9,'octombrie':10,'noiembrie':11,'decembrie':12} %}
  {% set nm = {1:'🟡 galben',2:'🟠 portocaliu',3:'🔴 roșu'} %}
  {% set d = namespace(mesaj=none) %}
  {% for s in states.sensor if s.entity_id.startswith('sensor.mesaj_meteo_') %}
  {% if d.mesaj is none %}{% set d.mesaj = s %}{% endif %}
  {% endfor %}
  {% set cod = d.mesaj.attributes.judet_cod if d.mesaj is not none else '' %}
  {% set nume = d.mesaj.attributes.judet if d.mesaj is not none else '' %}
  {% set av = state_attr('sensor.avertizari_meteo_anm','avertizari') %}
  {% set ns = namespace(l=[]) %}
  {% if av is iterable and av is not string %}
  {% for w in av if w.judet == cod and (w.culoare|int(0)) > 0 %}
  {% set p = w.intervalul | regex_findall('(\\d+) ([a-zăâîșț]+), ora (\\d+)') %}
  {% if p | length == 2 %}
  {% set s = now().replace(month=luni[p[0][1]], day=p[0][0]|int, hour=p[0][2]|int, minute=0, second=0, microsecond=0) %}
  {% set e = now().replace(month=luni[p[1][1]], day=p[1][0]|int, hour=p[1][2]|int, minute=0, second=0, microsecond=0) %}
  {% if s <= now() < e %}
  {% set ns.l = ns.l + ['**ACUM** ' ~ nm[w.culoare|int] ~ ' · ' ~ w.fenomene_vizate ~ ' · până ' ~ e.strftime('%d.%m %H:%M')] %}
  {% elif now() < s %}
  {% set ns.l = ns.l + ['Urmează ' ~ nm[w.culoare|int] ~ ' · ' ~ w.fenomene_vizate ~ ' · ' ~ s.strftime('%d.%m %H:%M') ~ ' – ' ~ e.strftime('%d.%m %H:%M')] %}
  {% endif %}
  {% endif %}
  {% endfor %}
  {% endif %}
  ### 🌦️ ANM{{ ' · ' ~ nume if nume else '' }}
  {% if ns.l | length == 0 %}✅ Nicio avertizare activă sau viitoare
  {% else %}{% for x in ns.l %}- {{ x }}
  {% endfor %}{% endif %}

  ### ⚡ Nowcasting (următoarele ore)
  {% for e in states.sensor if e.entity_id.startswith('sensor.alerta_nowcasting_') %}
  {% if e.attributes.get('Alerte active', 0) | int(0) > 0 %}**{{ e.attributes.get('Județ', '') }}** · {{ e.attributes.get('Culoare', '') }} · {{ e.attributes.get('semnalare', '') }}
  {{ e.attributes.get('Început', '') }} – {{ e.attributes.get('Sfârșit', '') }}
  {% else %}✅ {{ e.attributes.get('Județ', '') }}: fără alertă · actualizat {{ e.attributes.get('Ultima actualizare', '') }}
  {% endif %}
  {% endfor %}
